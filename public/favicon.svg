<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White background -->
  <rect width="64" height="64" fill="#FFFFFF"/>

  <!-- Rounded square border -->
  <rect
    x="8"
    y="8"
    width="48"
    height="48"
    rx="10"
    ry="10"
    fill="none"
    stroke="#000000"
    stroke-width="5.5"
  />

  <!-- TX Logo -->
  <text
    x="50%"
    y="54%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="900"
    letter-spacing="-2"
    fill="#000000">TX</text>
</svg>
